<script>/* Tablette : écran large et tactile, ou ?tablette dans l'adresse pour la démo sur ordinateur */
(function(){try{var q=location.search.indexOf('tablette')>=0;if(q)localStorage.setItem('restock.forceTablet','1');if(location.search.indexOf('telephone')>=0)localStorage.removeItem('restock.forceTablet');
var f=localStorage.getItem('restock.forceTablet');var t=matchMedia('(min-width: 700px) and (pointer: coarse)').matches;var d=matchMedia('(min-width: 760px)').matches&&!(localStorage.getItem('restock.forceMobile'));var h=document.documentElement.classList;if(t||f||d)h.add('tablet');if(d)h.add('desktop');}catch(e){}})();</script>
